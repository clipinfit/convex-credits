name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm bundled with Node 22 crashes on the nested workspace fixture.
      # Use the same version as the verified local consumer checks.
      - run: npm install --global npm@11.14.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run pack:check
      - run: bun run pack:check
        env:
          CREDITS_TEST_CONVEX_VERSION: 1.45.0
